<script>
document.addEventListener('DOMContentLoaded', function() {
  const menuBtn = document.getElementById('mobile-menu-btn');
  const mobileMenu = document.getElementById('mobile-menu');
  menuBtn.addEventListener('click', function() {
    mobileMenu.classList.toggle('hidden');
  });
});
function filterOverseas(region) {
  const cards = document.querySelectorAll('[data-region]');
  const buttons = document.querySelectorAll('.squishy-button');
  buttons.forEach(b => {
    b.classList.remove('bg-primary', 'text-on-primary');
    b.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
  });
  const activeBtn = region === 'all' ? buttons[0] : Array.from(buttons).find(b => b.textContent.includes(
    region === 'asia' ? '아시아' : region === 'europe' ? '유럽' : '미주'
  ));
  if (activeBtn) {
    activeBtn.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
    activeBtn.classList.add('bg-primary', 'text-on-primary');
  }
  cards.forEach(card => {
    card.style.display = (region === 'all' || card.dataset.region === region) ? 'block' : 'none';
  });
}
</script>
